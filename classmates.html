<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级同学名单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', cursive, sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .title {
            font-size: clamp(32px, 6vw, 52px);
            color: #fff;
            text-shadow: 3px 3px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title::before,
        .title::after {
            content: '✨';
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1200px;
            width: 100%;
        }

        .name-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 30px;
            border-radius: 50px;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: bold;
            color: #2d3436;
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            cursor: pointer;
            animation: fadeInUp 0.6s ease-out backwards;
            position: relative;
            overflow: hidden;
        }

        .name-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .name-card:hover::before {
            left: 100%;
        }

        .name-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.25),
                0 0 30px rgba(255, 255, 255, 0.3);
        }

        .name-card:nth-child(odd) {
            background: linear-gradient(135deg, #fff5f5, #fff0f6);
            color: #e74c3c;
        }

        .name-card:nth-child(even) {
            background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
            color: #2e7d32;
        }

        .name-card:nth-child(3n) {
            background: linear-gradient(135deg, #fffde7, #fff9c4);
            color: #f57c00;
        }

        .name-card:nth-child(4n) {
            background: linear-gradient(135deg, #f3e5f5, #e1bee7);
            color: #7b1fa2;
        }

        .name-card:nth-child(5n) {
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            color: #00838f;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .total-count {
            margin-top: 40px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .floating-decoration {
            position: fixed;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        .heart {
            width: 20px;
            height: 20px;
            background: rgba(255, 107, 107, 0.6);
            transform: rotate(-45deg);
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 107, 107, 0.6);
            border-radius: 50%;
        }

        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; left: -10px; }

        .star {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 22px solid rgba(255, 215, 0, 0.6);
        }

        .star::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid rgba(255, 215, 0, 0.6);
            top: 7px;
            left: -12px;
        }

        .circle {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.6);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #fff, #f9f9f9);
            padding: 40px;
            border-radius: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlide 0.4s ease-out;
            position: relative;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(-50px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-name {
            font-size: 32px;
            color: #e74c3c;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-blessing {
            font-size: 20px;
            color: #2d3436;
            line-height: 1.8;
            white-space: pre-line;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: #999;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #e74c3c;
        }

        .music-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
            font-size: 24px;
        }

        .music-btn:hover {
            transform: scale(1.1);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .nav-link {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-family: 'Ma Shan Zheng', cursive;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .name-card {
                padding: 14px 22px;
                font-size: clamp(14px, 4vw, 18px);
            }

            .title {
                font-size: clamp(24px, 5vw, 36px);
            }

            .container {
                gap: 10px;
            }

            .modal-content {
                padding: 30px 20px;
            }

            .modal-name {
                font-size: 26px;
            }

            .modal-blessing {
                font-size: 18px;
            }

            .music-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .nav-links {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
</head>
<body>
    <div class="floating-decoration heart" style="top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="floating-decoration star" style="top: 25%; right: 8%; animation-delay: 1s;"></div>
    <div class="floating-decoration circle" style="bottom: 30%; left: 10%; animation-delay: 2s;"></div>
    <div class="floating-decoration heart" style="bottom: 15%; right: 15%; animation-delay: 3s;"></div>
    <div class="floating-decoration star" style="top: 40%; left: 15%; animation-delay: 4s;"></div>
    <div class="floating-decoration circle" style="top: 60%; right: 10%; animation-delay: 5s;"></div>

    <h1 class="title">🌟 我们的班级 🌟</h1>
    
    <div class="container" id="nameContainer"></div>
    
    <div class="total-count" id="totalCount"></div>

    <div class="nav-links">
        <a href="index.html" class="nav-link">🏠 返回首页</a>
        <a href="gallery.html" class="nav-link">📷 浏览班级相册</a>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <div class="modal-name" id="modalName"></div>
            <div class="modal-blessing" id="modalBlessing"></div>
        </div>
    </div>

    <audio id="bgm" src="./音乐.MP3" loop preload="auto">
    
    <button class="music-btn" id="musicBtn">🔊</button>
    <div id="musicTip" style="display: none; position: fixed; bottom: 100px; left: 30px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; backdrop-filter: blur(10px); z-index: 100;">点击播放音乐</div>

    <script>
        const audio = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');
        const musicTip = document.getElementById('musicTip');
        
        audio.volume = 0.3;
        
        async function playMusic() {
            try {
                await audio.play();
                musicBtn.textContent = '🔊';
                musicTip.style.display = 'none';
            } catch (e) {
                musicBtn.textContent = '🔇';
                musicBtn.style.border = '2px solid #e74c3c';
                musicTip.style.display = 'block';
            }
        }
        
        audio.addEventListener('error', () => {
            musicBtn.textContent = '⚠️';
            musicTip.textContent = '无法加载音乐文件';
            musicTip.style.display = 'block';
        });
        
        audio.addEventListener('canplay', () => {
            playMusic();
        });
        
        audio.addEventListener('loadedmetadata', () => {
            playMusic();
        });
        
        setTimeout(() => {
            if (audio.readyState < 2) {
                musicBtn.textContent = '⚠️';
                musicTip.textContent = '音乐加载中...';
                musicTip.style.display = 'block';
            }
        }, 3000);
        
        document.addEventListener('click', () => {
            if (audio.paused && audio.readyState >= 2) {
                audio.play();
                musicBtn.textContent = '🔊';
                musicBtn.style.border = 'none';
                musicTip.style.display = 'none';
            }
        }, { once: true });
        
        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.readyState < 2) {
                musicTip.textContent = '音乐加载中，请稍候...';
                musicTip.style.display = 'block';
                return;
            }
            if (audio.paused) {
                audio.play();
                musicBtn.textContent = '🔊';
                musicBtn.style.border = 'none';
                musicTip.style.display = 'none';
            } else {
                audio.pause();
                musicBtn.textContent = '🔇';
            }
        });

        const classmates = [
            { name: '张竣豪', blessing: '祝老师身体健康，笑口常开！' },
            { name: '温云博', blessing: '愿老师工作顺利，桃李满天下！' },
            { name: '谢亚恒', blessing: '祝老师生活幸福美满！' },
            { name: '魏仲骏', blessing: '老师辛苦了，感谢您的教导！' },
            { name: '许赫', blessing: '愿老师天天开心，万事如意！' },
            { name: '刘冲', blessing: '祝老师青春永驻，永远年轻！' },
            { name: '王靖翔', blessing: '感谢老师辛勤付出，祝您幸福！' },
            { name: '魏裕清', blessing: '愿老师心想事成，好运连连！' },
            { name: '欧阳一顺', blessing: '祝老师一帆风顺，前程似锦！' },
            { name: '徐梦轩', blessing: '愿老师梦想成真，生活精彩！' },
            { name: '李梓凡', blessing: '祝老师平平安安，健健康康！' },
            { name: '蒋诗琛', blessing: '感谢老师陪伴我们成长！' },
            { name: '杜辛甜', blessing: '愿老师生活甜蜜，幸福美满！' },
            { name: '张哲皓', blessing: '祝老师智慧无穷，魅力四射！' },
            { name: '戚海波', blessing: '愿老师如海般胸怀宽广！' },
            { name: '邓博文', blessing: '祝老师文采飞扬，才华横溢！' },
            { name: '单钰博', blessing: '愿老师博学多才，桃李芬芳！' },
            { name: '许嘉航', blessing: '祝老师扬帆远航，成就辉煌！' },
            { name: '林齐杭', blessing: '愿老师事事顺心，步步高升！' },
            { name: '厉静怡', blessing: '祝老师安静美好，岁月静好！' },
            { name: '周一义', blessing: '愿老师正义满满，正能量爆棚！' },
            { name: '毛欣悦', blessing: '祝老师喜气洋洋，悦享人生！' },
            { name: '周雨晴', blessing: '愿老师心中永远充满阳光！' },
            { name: '薛新颢', blessing: '祝老师新的一年前程似锦！' },
            { name: '佟文浩', blessing: '愿老师文思泉涌，浩气长存！' },
            { name: '郑诗诺', blessing: '祝老师诗情画意，诺言成真！' },
            { name: '孙国庆', blessing: '感谢老师为我们的付出！' },
            { name: '刘逸轩', blessing: '愿老师飘逸潇洒，轩昂气宇！' },
            { name: '张紫凝', blessing: '祝老师紫气东来，凝福聚瑞！' },
            { name: '张智凯', blessing: '愿老师智慧如海，凯旋归来！' },
            { name: '詹彤欣', blessing: '祝老师红红火火，欣欣向荣！' },
            { name: '张孜翔', blessing: '愿老师孜孜不倦，自由翱翔！' },
            { name: '王延杰', blessing: '祝老师杰出优秀，品学兼优！' },
            { name: '谢璐遥', blessing: '愿老师路途遥远也有美景相伴！' },
            { name: '郭宸赫', blessing: '祝老师气宇轩昂，赫赫有名！' },
            { name: '杨子恒', blessing: '愿老师恒久幸福，永远快乐！' },
            { name: '马梓恩', blessing: '感谢老师恩情，永记在心！' },
            { name: '陈荣宽', blessing: '祝老师荣华富贵，宽厚待人！' },
            { name: '许智硕', blessing: '愿老师智慧卓越，硕果累累！' },
            { name: '孙俊峰', blessing: '祝老师俊秀超群，登峰造极！' },
            { name: '19计应51班', blessing: '19计应51班全体同学祝老师工作顺利，身体健康，桃李满天下！' },
            { name: '朱宇森', blessing: '祝老师春风化雨，润物无声，永远年轻！' }
        ];

        const container = document.getElementById('nameContainer');
        const totalCount = document.getElementById('totalCount');
        const modal = document.getElementById('modal');
        const modalName = document.getElementById('modalName');
        const modalBlessing = document.getElementById('modalBlessing');
        const modalClose = document.getElementById('modalClose');

        classmates.forEach((student, index) => {
            const card = document.createElement('div');
            card.className = 'name-card';
            card.textContent = student.name;
            card.style.animationDelay = `${index * 0.05}s`;
            
            card.addEventListener('click', () => {
                modalName.textContent = student.name;
                modalBlessing.textContent = student.blessing;
                modal.classList.add('show');
            });
            
            container.appendChild(card);
        });

        totalCount.textContent = `共 ${classmates.length} 位同学`;

        modalClose.addEventListener('click', () => {
            modal.classList.remove('show');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });

        audio.volume = 0.3;
        
        musicBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            musicBtn.textContent = audio.muted ? '🔇' : '🔊';
        });
    </script>
</body>
</html>
